<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jatBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0c12"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="jatAccent" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#646cff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#jatBg)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Inventory & Finance App Mockup Frame -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#111422" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
  
  <!-- Browser topbar -->
  <rect x="70" y="50" width="660" height="42" rx="16" fill="#15192c"/>
  <circle cx="100" cy="71" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="118" cy="71" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="136" cy="71" r="5" fill="#22c55e" opacity="0.8"/>
  <rect x="230" y="61" width="340" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="400" y="75" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">jatra.erp/inventory-finance</text>

  <!-- Navigation Bar inside app -->
  <rect x="90" y="108" width="620" height="35" rx="8" fill="#171b30"/>
  <text x="110" y="130" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Jatra Core</text>
  <text x="210" y="130" fill="#10b981" font-family="sans-serif" font-size="12">Inventory</text>
  <text x="290" y="130" fill="#8892b0" font-family="sans-serif" font-size="12">General Ledger</text>
  <text x="400" y="130" fill="#8892b0" font-family="sans-serif" font-size="12">Invoicing</text>
  <text x="480" y="130" fill="#8892b0" font-family="sans-serif" font-size="12">Warehouse Audit</text>

  <!-- Split Panels: Financials & Stock flow -->
  <!-- Left Panel: Financial Balance -->
  <rect x="90" y="155" width="290" height="225" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.05)"/>
  <text x="110" y="185" fill="#8892b0" font-family="sans-serif" font-size="12">Cashflow &amp; Balance Sheet</text>
  <text x="110" y="215" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="700">+34.8% Margin</text>
  
  <!-- Financial bar comparison -->
  <rect x="110" y="240" width="250" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="110" y="240" width="180" height="12" rx="6" fill="#10b981"/>

  <rect x="110" y="270" width="250" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="110" y="270" width="140" height="12" rx="6" fill="#646cff"/>

  <text x="110" y="315" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11">Automated Reconciliation: Active</text>
  <text x="110" y="340" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11">Multi-branch Warehouses: 4 Sites</text>

  <!-- Right Panel: Inventory table -->
  <rect x="400" y="155" width="310" height="225" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.05)"/>
  <text x="420" y="185" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Realtime SKU Stock Levels</text>

  <rect x="420" y="205" width="270" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="430" y="223" fill="#e2e8f0" font-family="sans-serif" font-size="11">SKU-9901 | Raw Materials</text>
  <text x="650" y="223" fill="#10b981" font-family="'Fira Code', monospace" font-size="11">1,420 u</text>

  <rect x="420" y="240" width="270" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="430" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="11">SKU-8842 | Packaging Goods</text>
  <text x="650" y="258" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">5,800 u</text>

  <rect x="420" y="275" width="270" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="430" y="293" fill="#e2e8f0" font-family="sans-serif" font-size="11">SKU-3124 | Finished Product</text>
  <text x="650" y="293" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="11">890 u</text>

  <rect x="420" y="320" width="270" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="555" y="344" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Generate Tax &amp; Audit Report</text>
</svg>
