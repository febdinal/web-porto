<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e0f17"/>
      <stop offset="0.5" stop-color="#141524"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#646cff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="200" y1="100" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#646cff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyberGlow" cx="200" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#646cff" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="180" fill="url(#cyberGlow)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
  </g>

  <!-- Hexagonal Tech Shield -->
  <polygon points="200,50 320,120 320,280 200,350 80,280 80,120" 
           fill="#11121d" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Inner Outer Orbit Rings -->
  <circle cx="200" cy="200" r="130" stroke="rgba(100, 108, 255, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="105" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Central Glow -->
  <circle cx="200" cy="200" r="85" fill="url(#glowGrad)"/>

  <!-- Stylized Monogram F + Terminal Code Glyph -->
  <g filter="url(#glowFilter)">
    <!-- Terminal prompt symbol < / > -->
    <path d="M125 185 L105 200 L125 215" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M275 185 L295 200 L275 215" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric F Letterform -->
    <path d="M175 140 H235 C238 140 240 142 240 145 V165 C240 168 238 170 235 170 H195 V190 H225 C228 190 230 192 230 195 V215 C230 218 228 220 225 220 H195 V260 C195 263 193 265 190 265 H175 C172 265 170 263 170 260 V145 C170 142 172 140 175 140 Z" 
          fill="url(#accentGrad)"/>
  </g>

  <!-- Status Ping Dot -->
  <circle cx="200" cy="310" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="310" r="8" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Subtitle Tag -->
  <text x="200" y="335" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="3">SOFTWARE ENG</text>
</svg>
