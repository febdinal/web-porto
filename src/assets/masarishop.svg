<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="masBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#14111f"/>
    </linearGradient>
    <linearGradient id="masAccent" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#masBg)"/>

  <!-- E-commerce Store Mockup Frame -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#13121c" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5"/>
  
  <!-- Browser topbar -->
  <rect x="70" y="50" width="660" height="42" rx="16" fill="#1a1826"/>
  <circle cx="100" cy="71" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="118" cy="71" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="136" cy="71" r="5" fill="#22c55e" opacity="0.8"/>
  <rect x="230" y="61" width="340" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="400" y="75" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">masarishop.com/collections</text>

  <!-- Store Navbar -->
  <rect x="90" y="105" width="620" height="36" rx="8" fill="#1b182b"/>
  <text x="110" y="128" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">MASARI</text>
  <text x="210" y="128" fill="#ec4899" font-family="sans-serif" font-size="11">New Arrivals</text>
  <text x="310" y="128" fill="#8892b0" font-family="sans-serif" font-size="11">Accessories</text>
  <text x="410" y="128" fill="#8892b0" font-family="sans-serif" font-size="11">Footwear</text>
  <!-- Search & Cart -->
  <rect x="580" y="112" width="115" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="637" y="127" fill="#8892b0" font-family="sans-serif" font-size="10" text-anchor="middle">Cart (3 Items)</text>

  <!-- Product Grid Showcase -->
  <!-- Product 1 -->
  <rect x="90" y="155" width="190" height="225" rx="10" fill="#1a1829" stroke="rgba(255,255,255,0.05)"/>
  <rect x="105" y="170" width="160" height="110" rx="8" fill="#221e35"/>
  <circle cx="185" cy="225" r="30" fill="url(#masAccent)" opacity="0.4"/>
  <text x="105" y="305" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Minimalist Leather Bag</text>
  <text x="105" y="325" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="700">IDR 1.250.000</text>
  <rect x="105" y="340" width="160" height="26" rx="6" fill="rgba(236, 72, 153, 0.2)"/>
  <text x="185" y="357" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Quick Add</text>

  <!-- Product 2 -->
  <rect x="305" y="155" width="190" height="225" rx="10" fill="#1a1829" stroke="rgba(255,255,255,0.05)"/>
  <rect x="320" y="170" width="160" height="110" rx="8" fill="#221e35"/>
  <rect x="360" y="195" width="80" height="60" rx="6" fill="#8b5cf6" opacity="0.35"/>
  <text x="320" y="305" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Contemporary Chrono</text>
  <text x="320" y="325" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="700">IDR 2.890.000</text>
  <rect x="320" y="340" width="160" height="26" rx="6" fill="rgba(236, 72, 153, 0.2)"/>
  <text x="400" y="357" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Quick Add</text>

  <!-- Product 3 -->
  <rect x="520" y="155" width="190" height="225" rx="10" fill="#1a1829" stroke="rgba(255,255,255,0.05)"/>
  <rect x="535" y="170" width="160" height="110" rx="8" fill="#221e35"/>
  <polygon points="615,190 645,245 585,245" fill="#ec4899" opacity="0.35"/>
  <text x="535" y="305" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Polarized Aviators</text>
  <text x="535" y="325" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="700">IDR 850.000</text>
  <rect x="535" y="340" width="160" height="26" rx="6" fill="rgba(236, 72, 153, 0.2)"/>
  <text x="615" y="357" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Quick Add</text>
</svg>
