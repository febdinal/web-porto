<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="larBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#141726"/>
    </linearGradient>
    <linearGradient id="larAccent" x1="100" y1="50" x2="700" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#646cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#larBg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- POS Dashboard Mockup Frame -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#10131f" stroke="rgba(100, 108, 255, 0.3)" stroke-width="1.5"/>
  
  <!-- Browser topbar -->
  <rect x="70" y="50" width="660" height="42" rx="16" fill="#161a2c"/>
  <circle cx="100" cy="71" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="118" cy="71" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="136" cy="71" r="5" fill="#22c55e" opacity="0.8"/>
  <rect x="230" y="61" width="340" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="400" y="75" fill="#8892b0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">app.larisin.id/pos/dashboard</text>

  <!-- Left Sidebar -->
  <rect x="70" y="92" width="130" height="308" fill="#121524"/>
  <rect x="85" y="115" width="100" height="22" rx="6" fill="rgba(100, 108, 255, 0.2)"/>
  <rect x="85" y="150" width="80" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="85" y="180" width="90" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="85" y="210" width="75" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>

  <!-- Metrics Cards -->
  <rect x="225" y="115" width="145" height="75" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.06)"/>
  <text x="240" y="140" fill="#8892b0" font-family="sans-serif" font-size="11">Daily Sales</text>
  <text x="240" y="168" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">Rp 12.450.000</text>

  <rect x="385" y="115" width="145" height="75" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.06)"/>
  <text x="400" y="140" fill="#8892b0" font-family="sans-serif" font-size="11">Transactions</text>
  <text x="400" y="168" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700">328 Orders</text>

  <rect x="545" y="115" width="155" height="75" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.06)"/>
  <text x="560" y="140" fill="#8892b0" font-family="sans-serif" font-size="11">Inventory Alert</text>
  <text x="560" y="168" fill="#a78bfa" font-family="sans-serif" font-size="18" font-weight="700">98% In Stock</text>

  <!-- Chart / POS Terminal Table Mock -->
  <rect x="225" y="210" width="475" height="165" rx="10" fill="#171b30" stroke="rgba(255,255,255,0.06)"/>
  <!-- Chart Bars -->
  <path d="M 250 330 L 290 280 L 330 300 L 370 250 L 410 270 L 450 230 L 490 240 L 530 220 L 570 245 L 610 215 L 660 235" 
        stroke="url(#larAccent)" stroke-width="3" fill="none"/>
  <circle cx="610" cy="215" r="5" fill="#38bdf8"/>
  <text x="250" y="235" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600">POS Revenue &amp; Realtime Sync</text>
</svg>
